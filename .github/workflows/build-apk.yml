name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (preinstalled on the build machine)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Install packages
        run: npm ci

      - name: Create the Android project
        run: npx cap add android

      - name: App icons and splash
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#1B2130' --iconBackgroundColorDark '#1B2130' \
            --splashBackgroundColor '#1B2130' --splashBackgroundColorDark '#1B2130'
          mkdir -p android/app/src/main/res/drawable
          cp resources/ic_stat_icon.png android/app/src/main/res/drawable/ic_stat_icon.png

      - name: Copy the web app in
        run: npx cap sync android

      - name: Version numbers
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # tolerate spaces or line breaks picked up while copying and pasting
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/release.keystore" \
              || { echo "::error::KEYSTORE_BASE64 secret isn't valid. Re-copy the whole of keystore-base64.txt (Ctrl+A, Ctrl+C) and paste it again."; exit 1; }
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" > /dev/null \
              || { echo "::error::The key was decoded but the password or alias doesn't match. Check KEYSTORE_PASSWORD, KEY_PASSWORD and KEY_ALIAS."; exit 1; }
            echo "Signing key OK."
            echo "HAS_KEY=yes" >> "$GITHUB_ENV"
          else
            echo "HAS_KEY=no" >> "$GITHUB_ENV"
            echo "No signing key in Secrets yet, building a test APK instead."
          fi

      - name: Build signed release
        if: env.HAS_KEY == 'yes'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          cp app/build/outputs/apk/release/app-release.apk "../JobPlanner-${VERSION}.apk"

      - name: Build debug (no signing key set up yet)
        if: env.HAS_KEY == 'no'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../JobPlanner-${VERSION}-unsigned-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: JobPlanner-apk
          path: JobPlanner-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Job Planner ${{ env.VERSION }} (build ${{ github.run_number }})
          files: JobPlanner-*.apk
          body: |
            Download the .apk below on your phone and open it to install.
            First time only: Android will ask you to allow installs from your browser.
